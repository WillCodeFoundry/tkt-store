# Weekly: the whole suite on every supported Python against the newest dependency
# versions pyproject.toml allows (ignoring uv.lock), so upstream drift and breakage on
# newer Pythons show up without blocking PRs (which test the floor).
name: latest-deps

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"] # requires-python floor .. newest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ matrix.python }} # overrides .python-version
      - run: uv sync --upgrade --group dev
      - run: uv run pytest
