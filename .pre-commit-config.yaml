repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff-format
      - id: ruff
  - repo: local
    hooks:
      - id: architecture
        name: module boundaries
        entry: python -m pytest -q tests/unit/test_architecture.py
        language: system
        pass_filenames: false
        types: [python]
