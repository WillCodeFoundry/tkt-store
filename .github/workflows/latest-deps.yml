# Weekly: the whole suite on every supported Python against the newest dependency
# versions pyproject.toml allows (ignoring uv.lock), so upstream drift and breakage on
# newer Pythons show up without blocking PRs (which test the floor). It runs the pre-push
# stage of .pre-commit-config.yaml (the whole suite), as git's pre-push hook does.
name: latest-deps

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"] # requires-python floor .. newest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }} # overrides .python-version
      - run: uv sync --upgrade --group dev
      - run: uv run pre-commit run --hook-stage pre-push
