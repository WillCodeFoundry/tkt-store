# One job per hook in .pre-commit-config.yaml, the only place checks are defined. The
# `hooks` job reads the hooks (and their stages) from that file, so adding or removing a
# hook there adds or removes its job here; nothing in this file names a hook or a tool.
# Each job runs its hook as git's own hook would (`pre-commit run <id> --hook-stage
# <stage>`, no file arguments). Python comes from .python-version (the requires-python
# floor), as it does locally; newer Pythons run weekly (latest-deps.yml).
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hooks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - id: list
        run: |
          matrix=$(uv run --no-project --with pyyaml python - <<'EOF'
          import json
          import yaml

          config = yaml.safe_load(open(".pre-commit-config.yaml"))
          default = config.get("default_stages", ["pre-commit"])
          print(json.dumps([
              {"id": hook["id"], "name": hook.get("name", hook["id"]), "stage": stage}
              for repo in config["repos"]
              for hook in repo["hooks"]
              for stage in hook.get("stages", default)
          ]))
          EOF
          )
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  hook:
    needs: hooks
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.hooks.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked --group dev
      - run: uv run pre-commit run "$HOOK" --hook-stage "$STAGE"
        env:
          HOOK: ${{ matrix.id }}
          STAGE: ${{ matrix.stage }}
