# The one definition of the repository's checks. Everything runs these hooks the way
# git's own hooks do (`pre-commit run [--hook-stage pre-push]`, no file arguments) and
# never repeats their commands:
#   - git hooks (once per clone: `uv run pre-commit install --hook-type pre-commit
#     --hook-type pre-push`): the pre-commit stage on commit, the pre-push stage on push;
#   - the Claude Code hook (.claude/hooks/pre-commit-checks.sh): the same stages, when
#     git's own hooks are not installed;
#   - CI (.github/workflows/ci.yml): one job per hook, read from this file;
#   - by hand: `uv run pre-commit run` (the commit checks), and
#     `uv run pre-commit run --hook-stage pre-push` (the whole suite).
#
# All hooks are `repo: local` and run via `uv run`, so the only place any tool's version
# is pinned is the `dev` group in pyproject.toml. Each checks the whole repository, not
# the files a commit touches (`pass_filenames: false`), and runs whatever changed
# (`always_run`): ruff also formats Python inside Markdown, and pyproject.toml configures
# every tool, so no file type is safe to skip. Every hook names its stage.
repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format --check
        entry: uv run ruff format --check .
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check .
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: pytest-fast
        name: pytest (tests that need no git)
        entry: uv run pytest -m "not git"
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: pytest
        name: pytest (the whole suite)
        entry: uv run pytest
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
