# All hooks are `repo: local` and run via `uv run`, so the only place any tool's
# version is pinned is the `dev` group in pyproject.toml - never a second pin here.
#
# Install both hook types once per clone: `uv run pre-commit install --hook-type
# pre-commit --hook-type pre-push`. The pre-commit stage runs the cheap checks and the
# tests that need no git (about 8 s); the tests that run real git take about a minute,
# so the whole suite runs pre-push, exactly as CI's test job runs it.
repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format --check
        entry: uv run ruff format --check .
        language: system
        pass_filenames: false
        types: [python]
        stages: [pre-commit]
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check .
        language: system
        pass_filenames: false
        types: [python]
        stages: [pre-commit]
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        pass_filenames: false
        types: [python]
        stages: [pre-commit]
      - id: pytest-fast
        name: pytest (tests that need no git)
        entry: uv run pytest -m "not git"
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: pytest
        name: pytest (the whole suite, as CI runs it)
        entry: uv run pytest
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
