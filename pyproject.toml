# The uv workspace: docs/CONTRIBUTING.md (*Tooling*).

[dependency-groups]
dev = [
  "pytest>=8", "ruff==0.17.0", "mypy>=1.10", "pre-commit>=3",
  "state-store",  # installs the member under src/state-store, for its tests
]

[tool.uv]
default-groups = []  # dev tools are opt-in: `uv sync --group dev`

[tool.uv.workspace]
members = ["src/state-store"]

[tool.uv.sources]
state-store = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["src/state-store/tests"]
addopts = "-q --strict-markers"
markers = ["git: needs a real git binary"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src/state-store", "src/state-store/tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.11"  # the members' requires-python floor, whatever Python runs mypy
mypy_path = "src/state-store"
files = ["src"]
